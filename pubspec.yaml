name: sala_thimar
description: "سلة ثمار - تطبيق لبيع الخضروات والفواكه"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  device_preview: ^1.2.0
  go_router: ^15.1.2
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  flutter_svg: ^2.3.0
  get_it: ^8.0.3
  shared_preferences: ^2.5.3
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  skeletonizer: ^3.0.0
  toastification: ^3.2.2
  loading_animation_widget: ^1.3.0
  pin_code_fields: ^10.1.1
  circular_countdown_timer: ^0.2.4
  google_nav_bar: ^5.0.7
  cached_network_image: ^4.0.3
  carousel_slider: ^5.1.2
  pretty_dio_logger: ^1.4.0
  image_picker: ^1.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/illustrations/
    - assets/lottie/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
